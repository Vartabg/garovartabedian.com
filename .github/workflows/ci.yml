name: Manual verification

# Normal verification and production releases run on the local Mac.
# This optional diagnostic run consumes GitHub-hosted minutes when requested.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Manual checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Install PDF verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
      - name: Install Chrome
        run: npx playwright install --with-deps chrome
      - name: Verify
        run: npm run check
